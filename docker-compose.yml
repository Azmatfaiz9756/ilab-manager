version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ilab_postgres
    restart: always
    environment:
      POSTGRES_USER: ilab_admin
      POSTGRES_PASSWORD: ilab_secure_password
      POSTGRES_DB: ilab_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: ilab_backend
    restart: always
    environment:
      PORT: 4000
      DATABASE_URL: postgres://ilab_admin:ilab_secure_password@postgres:5432/ilab_manager
      JWT_SECRET: super_secure_production_jwt_secret_key_2026
      JWT_REFRESH_SECRET: super_secure_refresh_secret_key_2026
    ports:
      - '4000:4000'
    depends_on:
      - postgres

volumes:
  postgres_data:
